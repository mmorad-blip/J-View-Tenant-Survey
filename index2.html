<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Tenant Survey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink:#152238;
    --ink-soft:#5A6480;
    --ink-faint:#8890A6;
    --bg:#EFEBE1;
    --surface:#FFFFFF;
    --surface-alt:#F6F3EA;
    --accent:#96742F;
    --accent-ink:#6E5527;
    --accent-soft:#EFE3C8;
    --line:#DCD5C2;
    --line-soft:#EAE5D6;
    --success:#1F7A5C;
    --success-soft:#E4F1EA;
    --danger:#B23A2E;
    --danger-soft:#FBEAE8;
    --focus:#2F5FA8;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow:0 1px 2px rgba(21,34,56,.04), 0 8px 24px -12px rgba(21,34,56,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEBE3;
      --ink-soft:#B7BDD1;
      --ink-faint:#7B839C;
      --bg:#141826;
      --surface:#1D2233;
      --surface-alt:#242A3D;
      --accent:#D2AC5E;
      --accent-ink:#EBCE8E;
      --accent-soft:#3A3222;
      --line:#343B54;
      --line-soft:#2A3047;
      --success:#4FBE93;
      --success-soft:#173229;
      --danger:#E58077;
      --danger-soft:#3A2020;
      --focus:#7CA6E8;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEBE3;
    --ink-soft:#B7BDD1;
    --ink-faint:#7B839C;
    --bg:#141826;
    --surface:#1D2233;
    --surface-alt:#242A3D;
    --accent:#D2AC5E;
    --accent-ink:#EBCE8E;
    --accent-soft:#3A3222;
    --line:#343B54;
    --line-soft:#2A3047;
    --success:#4FBE93;
    --success-soft:#173229;
    --danger:#E58077;
    --danger-soft:#3A2020;
    --focus:#7CA6E8;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans','Segoe UI',Tahoma,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{
    font-family:'IBM Plex Sans Arabic','IBM Plex Sans','Segoe UI',Tahoma,sans-serif;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

  h1,h2,h3{text-wrap:balance;margin:0;}

  /* ---------- progress bar ---------- */
  #progress{position:fixed;top:0;inset-inline-start:0;height:3px;background:var(--accent);width:0%;z-index:60;transition:width .15s ease;}

  /* ---------- top bar ---------- */
  header.topbar{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:760px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo-chip{
    flex:none;background:#FFFFFF;border-radius:9px;padding:6px 10px;
    display:flex;align-items:center;box-shadow:0 1px 2px rgba(21,34,56,.12);
    border:1px solid rgba(21,34,56,.06);
  }
  .brand-logo-chip img{display:block;height:26px;width:auto;}
  .brand-text{display:flex;flex-direction:column;line-height:1.2;}
  .brand-text .name{font-weight:700;font-size:15px;}
  .brand-text .role{font-size:11.5px;color:var(--ink-soft);}

  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex:none;}
  .lang-toggle button{
    border:none;background:transparent;padding:6px 14px;border-radius:999px;
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .lang-toggle button.active{background:var(--ink);color:var(--bg);}
  .lang-toggle button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* ---------- layout ---------- */
  main{max-width:760px;margin:0 auto;padding:28px 20px 120px;}
  .hero{padding:6px 2px 22px;}
  .hero .eyebrow{
    font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent-ink);margin-bottom:10px;
  }
  html[lang="ar"] .hero .eyebrow{letter-spacing:0;}
  .hero h1{font-size:27px;font-weight:700;color:var(--ink);}
  .hero p.lede{margin-top:10px;font-size:15px;color:var(--ink-soft);max-width:60ch;}

  .notice{
    margin-top:20px;border:1px solid var(--line);background:var(--surface);
    border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);
  }
  .notice-row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft);}
  .notice-row:first-child{border-top:none;padding-top:0;}
  .notice-row .ico{
    flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    font-family:'IBM Plex Mono',monospace;
  }
  .notice-row p{margin:0;font-size:13.5px;color:var(--ink);}
  .notice-row b{color:var(--ink);}

  section.card{
    margin-top:26px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;
  }
  .card-head{padding:20px 22px 4px;}
  .card-head .section-label{font-size:12px;font-weight:600;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em;}
  html[lang="ar"] .card-head .section-label{letter-spacing:0;}
  .card-head h2{font-size:18px;font-weight:700;margin-top:6px;}
  .card-body{padding:14px 22px 22px;display:flex;flex-direction:column;gap:26px;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 22px 22px;}
  @media (max-width:560px){.field-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span2{grid-column:1 / -1;}
  .field label{font-size:13px;font-weight:600;color:var(--ink);}
  .field .hint{font-size:12px;color:var(--ink-faint);}
  input[type=text],input[type=number],input[type=tel],input[type=email],select,textarea{
    font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 12px;width:100%;
  }
  textarea{resize:vertical;min-height:78px;}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  input.invalid,select.invalid,textarea.invalid{border-color:var(--danger);background:var(--danger-soft);}

  /* ---------- questions ---------- */
  .q{display:flex;flex-direction:column;gap:10px;}
  .q-head{display:flex;gap:10px;align-items:baseline;}
  .q-num{
    flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-alt);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:2px;
  }
  .q-text{font-size:15px;font-weight:600;color:var(--ink);}
  .q-help{font-size:12.5px;color:var(--ink-faint);margin-inline-start:34px;margin-top:-6px;}
  .q-body{margin-inline-start:34px;display:flex;flex-direction:column;gap:8px;}

  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:560px){.opt-grid{grid-template-columns:1fr;}}
  .opt{
    display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);background:var(--surface-alt);
    border-radius:var(--radius-sm);padding:9px 11px;cursor:pointer;font-size:13.5px;
  }
  .opt:hover{border-color:var(--accent);}
  .opt input{margin-top:2px;flex:none;accent-color:var(--accent-ink);}
  .opt.checked{border-color:var(--accent);background:var(--accent-soft);}
  .opt.disabled{opacity:.45;cursor:not-allowed;}
  .opt .txt{flex:1;}
  .other-row{display:flex;align-items:center;gap:8px;}
  .other-row input{flex:1;}

  .limit-note{font-size:12px;color:var(--ink-faint);}
  .limit-note.hit{color:var(--accent-ink);font-weight:600;}

  /* rating table */
  .rate-table{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
  .rate-row{display:grid;grid-template-columns:1.6fr repeat(5,.6fr);align-items:center;border-top:1px solid var(--line-soft);}
  .rate-row:first-child{border-top:none;background:var(--surface-alt);}
  .rate-row .rlabel{padding:10px 12px;font-size:13px;font-weight:600;}
  .rate-row.head .rlabel{font-weight:700;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;}
  html[lang="ar"] .rate-row.head .rlabel{letter-spacing:0;}
  .rate-cell{display:flex;align-items:center;justify-content:center;padding:8px 4px;}
  .rate-row.head .rate-cell{font-size:11px;color:var(--ink-faint);text-align:center;font-weight:600;padding:6px 2px;}
  .rate-cell input{accent-color:var(--accent-ink);width:17px;height:17px;}

  /* rank rows */
  .rank-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface-alt);}
  .rank-row .txt{font-size:13.5px;font-weight:600;}
  .rank-row select{width:auto;min-width:150px;}

  /* matrix */
  .matrix{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
  .mrow{border-top:1px solid var(--line-soft);padding:12px;display:flex;flex-direction:column;gap:8px;}
  .mrow:first-child{border-top:none;}
  .mrow .mlabel{font-size:13.5px;font-weight:700;}
  .mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  @media (max-width:560px){.mopts{grid-template-columns:1fr;}}
  .mopt{border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;display:flex;align-items:center;gap:7px;cursor:pointer;background:var(--surface);}
  .mopt input{accent-color:var(--accent-ink);}
  .mopt.checked{border-color:var(--accent);background:var(--accent-soft);}
  .mopt .colname{font-weight:700;display:block;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  html[lang="ar"] .mopt .colname{letter-spacing:0;}

  /* incentive */
  .incentive-band{
    background:linear-gradient(135deg,var(--accent-soft),var(--surface-alt));
    border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;
    display:flex;align-items:center;gap:14px;
  }
  .incentive-band .amt{
    font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--accent-ink);
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:none;
  }
  .incentive-band p{margin:0;font-size:13px;color:var(--ink);}
  .reward-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:560px){.reward-opts{grid-template-columns:1fr;}}
  .reward-card{border:2px solid var(--line);border-radius:var(--radius-md);padding:14px;cursor:pointer;background:var(--surface-alt);display:flex;flex-direction:column;gap:4px;}
  .reward-card.checked{border-color:var(--accent-ink);background:var(--accent-soft);}
  .reward-card .rtitle{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .reward-card .rdesc{font-size:12.5px;color:var(--ink-soft);}

  /* consent */
  .consent{display:flex;align-items:flex-start;gap:10px;border:1px dashed var(--line);border-radius:var(--radius-md);padding:14px;background:var(--surface-alt);}
  .consent input{margin-top:3px;flex:none;accent-color:var(--accent-ink);}
  .consent label{font-size:13px;color:var(--ink);}

  /* disclaimer */
  details.disclaimer{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-alt);}
  details.disclaimer summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink-soft);list-style:none;display:flex;align-items:center;justify-content:space-between;}
  details.disclaimer summary::-webkit-details-marker{display:none;}
  details.disclaimer summary .chev{transition:transform .15s;}
  details.disclaimer[open] summary .chev{transform:rotate(180deg);}
  details.disclaimer .dbody{padding:0 16px 16px;font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:8px;}

  /* submit bar */
  .submit-bar{
    margin-top:26px;padding:16px 0 28px;
  }
  .error-summary{
    display:none;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);
    border-radius:var(--radius-md);padding:12px 14px;font-size:13px;margin-bottom:12px;font-weight:600;
  }
  .error-summary.show{display:block;}
  button.primary{
    width:100%;border:none;border-radius:var(--radius-md);background:var(--ink);color:var(--bg);
    font-family:inherit;font-weight:700;font-size:15.5px;padding:15px;cursor:pointer;
    box-shadow:var(--shadow);
  }
  button.primary:hover{background:var(--accent-ink);}
  button.primary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .submit-hint{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:8px;}

  footer.foot{max-width:760px;margin:0 auto;padding:0 20px 40px;font-size:11.5px;color:var(--ink-faint);text-align:center;}

  /* confirmation view */
  #confirmView, #closedView{display:none;max-width:640px;margin:0 auto;padding:60px 20px 80px;}
  #confirmView .check, #closedView .check{
    width:56px;height:56px;border-radius:16px;background:var(--success-soft);color:var(--success);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px;
  }
  #closedView .check{background:var(--accent-soft);color:var(--accent-ink);}
  #confirmView h1, #closedView h1{font-size:23px;text-align:center;}
  #confirmView p.sub, #closedView p.sub{text-align:center;color:var(--ink-soft);font-size:14.5px;margin-top:10px;max-width:48ch;margin-left:auto;margin-right:auto;}
  .capacity-note{font-size:12px;color:var(--accent-ink);margin-top:2px;}
  .capacity-note.low{font-weight:700;}
  .ref-box{
    margin:22px auto 0;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);
    padding:14px;text-align:center;box-shadow:var(--shadow);
  }
  .ref-box .lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .ref-box .code{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:4px;color:var(--ink);}
  .confirm-actions{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
  .confirm-actions button, .confirm-actions a{
    font-family:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer;text-decoration:none;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
  }
  .confirm-actions .primary-link{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .status-note{margin-top:22px;border-radius:var(--radius-md);padding:12px 14px;font-size:12.5px;text-align:center;}
  .status-note.ok{background:var(--success-soft);color:var(--success);}
  .status-note.pending{background:var(--accent-soft);color:var(--accent-ink);}

  [hidden]{display:none!important;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>

</head>
<body>
<div id="progress"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo-chip"><img id="brandLogoImg" alt="" src=""></div>
      <div class="brand-text">
        <span class="role" data-t="brandRole"></span>
      </div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="btnAr">العربية</button>
      <button type="button" id="btnEn">English</button>
    </div>
  </div>
</header>

<main id="formView">
  <div class="hero">
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="title"></h1>
    <p class="lede" data-t="lede"></p>
  </div>

  <div class="notice">
    <div class="notice-row">
      <div class="ico">1</div>
      <p data-t="notice1"></p>
    </div>
    <div class="notice-row">
      <div class="ico num">50</div>
      <p data-t="notice2"></p>
    </div>
    <div class="notice-row">
      <div class="ico">RI</div>
      <p data-t="notice3"></p>
    </div>
    <div class="notice-row">
      <div class="ico num">50</div>
      <p data-t="notice4"></p>
    </div>
    <div class="notice-row" id="capacityRow" hidden>
      <div class="ico">i</div>
      <p id="capacityText"></p>
    </div>
  </div>

  <section class="card" id="tenantCard">
    <div class="card-head">
      <div class="section-label" data-t="tenantEyebrow"></div>
      <h2 data-t="tenantHeading"></h2>
    </div>
    <div class="field-grid">
      <div class="field span2">
        <label for="f_name" data-t="lblName"></label>
        <input type="text" id="f_name" autocomplete="name">
      </div>
      <div class="field">
        <label for="f_building" data-t="lblBuilding"></label>
        <input type="text" id="f_building">
      </div>
      <div class="field">
        <label for="f_unit" data-t="lblUnit"></label>
        <input type="text" id="f_unit">
      </div>
      <div class="field">
        <label for="f_household" data-t="lblHousehold"></label>
        <input type="number" id="f_household" min="1" max="20" step="1">
      </div>
      <div class="field">
        <label for="f_nationality" data-t="lblNationality"></label>
        <input type="text" id="f_nationality" list="nationalityList">
        <datalist id="nationalityList"></datalist>
      </div>
    </div>
  </section>

  <div id="sections"></div>

  <section class="card" id="incentiveCard">
    <div class="card-head">
      <div class="section-label" data-t="incentiveEyebrow"></div>
      <h2 data-t="incentiveHeading"></h2>
    </div>
    <div class="card-body">
      <div class="incentive-band">
        <div class="amt num">50<br><span style="font-size:10px;font-weight:600;">SAR</span></div>
        <p data-t="incentiveText"></p>
      </div>
      <div class="field-grid" style="padding:0;">
        <div class="field">
          <label for="f_mobile" data-t="lblMobile"></label>
          <input type="tel" id="f_mobile" autocomplete="tel">
          <span class="hint" data-t="hintMobile"></span>
        </div>
        <div class="field">
          <label for="f_email" data-t="lblEmail"></label>
          <input type="email" id="f_email" autocomplete="email">
          <span class="hint" data-t="hintEmail"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-body" style="gap:16px;">
      <details class="disclaimer">
        <summary><span data-t="disclaimerHeading"></span><span class="chev">▾</span></summary>
        <div class="dbody" id="disclaimerBody"></div>
      </details>
      <div class="consent">
        <input type="checkbox" id="f_consent">
        <label for="f_consent" data-t="consentText"></label>
      </div>
    </div>
  </section>

  <div class="submit-bar">
    <div class="error-summary" id="errorSummary"></div>
    <button type="button" class="primary" id="submitBtn" data-t="submitBtn"></button>
    <p class="submit-hint" data-t="submitHint"></p>
  </div>

  <footer class="foot" data-t="footer"></footer>
</main>

<div id="confirmView">
  <div class="check">✓</div>
  <h1 id="confirmTitleEl"></h1>
  <p class="sub" id="confirmSubEl"></p>
  <div class="ref-box">
    <div class="lbl" data-t="refLabel"></div>
    <div class="code num" id="refCode"></div>
  </div>
  <div class="status-note" id="statusNote"></div>
  <div class="confirm-actions">
    <a href="#" id="emailBtn" data-t="emailBtn"></a>
  </div>
</div>

<div id="closedView">
  <div class="check num" style="font-size:19px;font-weight:700;">50</div>
  <h1 data-t="closedTitle"></h1>
  <p class="sub" id="closedSubText" data-t="closedSub"></p>
</div>

<script>

var state = {
  lang: "ar",
  tenant:{name:"",building:"",unit:"",household:"",nationality:""},
  answers:{}, // qid -> value(s)
  reward:"discount", mobile:"", email:"", consent:false,

  capacity:null // {count, max, closed} once known from the backend
};

function t(key){ return T[state.lang][key] || ""; }

function updateCapacityText(){
  var row = document.getElementById("capacityRow");
  var textEl = document.getElementById("capacityText");
  if(!row || !textEl) return;
  if(!state.capacity || state.capacity.closed){ row.hidden = true; return; }
  var remaining = Math.max(0, state.capacity.max - state.capacity.count);
  var key = remaining <= 10 ? "capacityFew" : "capacityRemaining";
  textEl.innerHTML = t(key).replace("{n}", String(remaining));
  row.hidden = false;
}

function showClosedView(){
  document.getElementById("formView").style.display = "none";
  document.getElementById("confirmView").style.display = "none";
  document.getElementById("closedView").style.display = "block";
}

function checkCapacity(){
  if(!SUBMIT_ENDPOINT) return;
  fetch(SUBMIT_ENDPOINT, {method:"GET"})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || typeof data.count !== "number") return;
      state.capacity = {count:data.count, max:data.max || 50, closed: !!data.closed};
      if(state.capacity.closed){ showClosedView(); }
      else { updateCapacityText(); }
    })
    .catch(function(){ /* endpoint unreachable — stay silent, cap still enforced at submit time */ });
}

function updateConfirmText(){
  var h1 = document.getElementById("confirmTitleEl");
  var sub = document.getElementById("confirmSubEl");
  if(!h1 || !sub) return;
  if(state.submitOutcome === "closed"){
    h1.textContent = t("closedAtSubmitTitle");
    sub.textContent = t("closedAtSubmitSub");
  } else {
    h1.textContent = t("confirmTitle");
    sub.textContent = t("confirmSub");
  }
}

/* ================= render ================= */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function txt(s){ return document.createTextNode(s); }

function renderStaticText(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(function(node){
    var key = node.getAttribute("data-t");
    var val = t(key);
    if(/^[a-z]/.test(key) && val.indexOf("<") !== -1) node.innerHTML = val;
    else node.textContent = val;
  });
  document.getElementById("btnAr").classList.toggle("active", state.lang === "ar");
  document.getElementById("btnEn").classList.toggle("active", state.lang === "en");
  document.getElementById("brandLogoImg").alt = state.lang === "ar" ? "شركة ركز الدولية" : "Rikz International";

  var dl = document.getElementById("nationalityList");
  dl.innerHTML = "";
  NATIONALITIES.forEach(function(n){ dl.appendChild(el("option",{value:n})); });

  var db = document.getElementById("disclaimerBody");
  db.innerHTML = "";
  T[state.lang].disclaimerBody.forEach(function(p){ db.appendChild(el("p",null,[txt(p)])); });

  updateConfirmText();
  updateCapacityText();
}

function buildOptionRow(q, opt, checked, disabledLimit){
  var isMulti = q.type === "multi";
  var input = el("input",{type: isMulti ? "checkbox" : "radio", name:q.id});
  input.value = opt.id;
  input.checked = checked;
  if(disabledLimit && !checked) input.disabled = true;
  var label = el("label",{class:"opt" + (checked?" checked":"") + (disabledLimit && !checked ? " disabled":"")},[
    input, el("span",{class:"txt"},[txt(opt[state.lang])])
  ]);
  input.addEventListener("change", function(){ onOptionChange(q, opt.id, input.checked); });
  return label;
}

function currentSelections(qid){
  var v = state.answers[qid];
  if(!v) return [];
  return Array.isArray(v) ? v : [v];
}

function onOptionChange(q, optId, checked){
  if(q.type === "single"){
    state.answers[q.id] = optId;
  } else {
    var cur = currentSelections(q.id).slice();
    if(q.exclusive){
      if(optId === q.exclusive && checked){ cur = [optId]; }
      else if(optId === q.exclusive && !checked){ cur = cur.filter(function(x){return x!==optId;}); }
      else {
        cur = cur.filter(function(x){return x!==q.exclusive;});
        if(checked) cur.push(optId); else cur = cur.filter(function(x){return x!==optId;});
      }
    } else {
      if(checked){ if(cur.indexOf(optId)===-1) cur.push(optId); }
      else { cur = cur.filter(function(x){return x!==optId;}); }
    }
    state.answers[q.id] = cur;
  }
  renderQuestion(q);
}

function buildQuestion(q){
  var wrap = el("div",{class:"q", id:"wrap_"+q.id});
  var head = el("div",{class:"q-head"},[
    el("div",{class:"q-num num"},[txt(String(q.num))]),
    el("div",{class:"q-text"},[txt(q.text[state.lang])])
  ]);
  wrap.appendChild(head);
  if(q.helpKey || q.help){
    wrap.appendChild(el("div",{class:"q-help"},[txt(q.helpKey ? t(q.helpKey) : q.help[state.lang])]));
  }
  var body = el("div",{class:"q-body", id:"body_"+q.id});
  wrap.appendChild(body);
  return wrap;
}

function renderQuestion(q){
  var body = document.getElementById("body_"+q.id);
  if(!body) return;
  body.innerHTML = "";

  if(q.type === "multi"){
    var sel = currentSelections(q.id);
    var atLimit = q.max < 90 && sel.length >= q.max;
    var grid = el("div",{class:"opt-grid"});
    q.options.forEach(function(opt){
      var checked = sel.indexOf(opt.id) !== -1;
      grid.appendChild(buildOptionRow(q, opt, checked, atLimit && !q.exclusive));
    });
    body.appendChild(grid);
    if(q.max < 90){
      var countText = state.lang === "ar"
        ? ("تم اختيار " + sel.length + " من " + q.max)
        : (sel.length + " of " + q.max + " selected");
      body.appendChild(el("div",{class:"limit-note" + (atLimit?" hit":"")},[
        txt(countText + (atLimit ? " — " + t("limitReached") : ""))
      ]));
    }
    if(q.other){
      var hasOther = state.answers[q.id+"_other_on"];
      var otherRow = el("div",{class:"other-row"});
      var cb = el("input",{type:"checkbox"});
      cb.checked = !!hasOther;
      cb.addEventListener("change", function(){
        state.answers[q.id+"_other_on"] = cb.checked;
        renderQuestion(q);
      });
      var otherLabel = el("label",{class:"opt" + (hasOther?" checked":"")},[cb, el("span",{class:"txt"},[txt(t("other"))])]);
      var otherInput = el("input",{type:"text", placeholder:""});
      otherInput.value = state.answers[q.id+"_other_text"] || "";
      otherInput.disabled = !hasOther;
      otherInput.addEventListener("input", function(){ state.answers[q.id+"_other_text"] = otherInput.value; });
      body.appendChild(el("div",{style:"display:flex;flex-direction:column;gap:8px;"},[otherLabel, otherInput]));
    }
  }
  else if(q.type === "single"){
    var grid2 = el("div",{class:"opt-grid"});
    q.options.forEach(function(opt){
      grid2.appendChild(buildOptionRow(q, opt, state.answers[q.id] === opt.id, false));
    });
    body.appendChild(grid2);
  }
  else if(q.type === "rating"){
    var table = el("div",{class:"rate-table"});
    var head = el("div",{class:"rate-row head"},[el("div",{class:"rlabel"},[])]);
    for(var i=1;i<=5;i++){
      head.appendChild(el("div",{class:"rate-cell"},[txt(i===1?t("scaleMin"):(i===5?t("scaleMax"):String(i)))]));
    }
    table.appendChild(head);
    q.rows.forEach(function(row){
      var tr = el("div",{class:"rate-row"});
      tr.appendChild(el("div",{class:"rlabel"},[txt(row[state.lang])]));
      for(var v=1; v<=5; v++){
        var radio = el("input",{type:"radio", name:q.id+"_"+row.id});
        radio.value = String(v);
        var cur = state.answers[q.id] || {};
        radio.checked = cur[row.id] === v;
        radio.addEventListener("change", function(rid, val){
          return function(){
            var obj = state.answers[q.id] || {};
            obj[rid] = val;
            state.answers[q.id] = obj;
          };
        }(row.id, v));
        tr.appendChild(el("div",{class:"rate-cell"},[radio]));
      }
      table.appendChild(tr);
    });
    body.appendChild(table);
  }
  else if(q.type === "rank"){
    var col = el("div",{style:"display:flex;flex-direction:column;gap:8px;"});
    var used = state.answers[q.id] || {};
    q.items.forEach(function(item){
      var row = el("div",{class:"rank-row"});
      row.appendChild(el("div",{class:"txt"},[txt(item[state.lang])]));
      var sel = el("select");
      sel.appendChild(el("option",{value:""},[txt(t("rankPlaceholder"))]));
      for(var r=1;r<=5;r++){
        var o = el("option",{value:String(r)},[txt(String(r))]);
        if(used[item.id] === r) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", function(iid){
        return function(){
          var obj = state.answers[q.id] || {};
          if(this.value === "") delete obj[iid]; else obj[iid] = parseInt(this.value,10);
          state.answers[q.id] = obj;
        };
      }(item.id));
      row.appendChild(sel);
      col.appendChild(row);
    });
    body.appendChild(col);
  }
  else if(q.type === "matrix"){
    var matrix = el("div",{class:"matrix"});
    var cur = state.answers[q.id] || {};
    q.rows.forEach(function(row){
      var mrow = el("div",{class:"mrow"});
      mrow.appendChild(el("div",{class:"mlabel"},[txt(row[state.lang])]));
      var opts = el("div",{class:"mopts"});
      row.opts.forEach(function(opt){
        var checked = cur[row.id] === opt.v;
        var radio = el("input",{type:"radio", name:q.id+"_"+row.id, class:"sr-only"});
        radio.checked = checked;
        radio.addEventListener("change", function(rid, val){
          return function(){
            var obj = state.answers[q.id] || {};
            obj[rid] = val;
            state.answers[q.id] = obj;
            renderQuestion(q);
          };
        }(row.id, opt.v));
        var colname = {s:{en:"Small",ar:"صغيرة"}, m:{en:"Medium",ar:"متوسطة"}, l:{en:"Large",ar:"كبيرة"}}[opt.v];
        var lab = el("label",{class:"mopt" + (checked?" checked":"")},[
          radio,
          el("span",null,[
            el("span",{class:"colname"},[txt(colname[state.lang])]),
            txt(opt[state.lang])
          ])
        ]);
        opts.appendChild(lab);
      });
      mrow.appendChild(opts);
      matrix.appendChild(mrow);
    });
    body.appendChild(matrix);
  }
  else if(q.type === "text"){
    var ta = el("textarea",{});
    ta.value = state.answers[q.id] || "";
    ta.addEventListener("input", function(){ state.answers[q.id] = ta.value; });
    body.appendChild(ta);
  }
}

function renderSections(){
  var container = document.getElementById("sections");
  container.innerHTML = "";
  SECTIONS.forEach(function(secId){
    var card = el("section",{class:"card"});
    var head = el("div",{class:"card-head"},[
      el("div",{class:"section-label"},[txt(SECTION_EYEBROW[secId][state.lang])]),
      el("h2",null,[txt(t(SECTION_KEY[secId]))])
    ]);
    card.appendChild(head);
    var body = el("div",{class:"card-body"});
    QUESTIONS.filter(function(q){return q.section === secId;}).forEach(function(q){
      body.appendChild(buildQuestion(q));
    });
    card.appendChild(body);
    container.appendChild(card);
  });
  QUESTIONS.forEach(renderQuestion);
}

function bindRewardCards(){
  document.querySelectorAll(".reward-card").forEach(function(card){
    card.addEventListener("click", function(){
      state.reward = card.getAttribute("data-val");
      syncRewardUI();
    });
  });
}
function syncRewardUI(){
  document.querySelectorAll(".reward-card").forEach(function(card){
    var v = card.getAttribute("data-val");
    card.classList.toggle("checked", state.reward === v);
    card.querySelector("input").checked = state.reward === v;
  });
}

function bindTenantFields(){
  var map = {f_name:"name", f_building:"building", f_unit:"unit", f_household:"household", f_nationality:"nationality"};
  Object.keys(map).forEach(function(id){
    var input = document.getElementById(id);
    input.value = state.tenant[map[id]] || "";
    input.addEventListener("input", function(){ state.tenant[map[id]] = input.value; input.classList.remove("invalid"); });
  });
  var mobile = document.getElementById("f_mobile"), email = document.getElementById("f_email");
  mobile.value = state.mobile; email.value = state.email;
  mobile.addEventListener("input", function(){ state.mobile = mobile.value; mobile.classList.remove("invalid"); });
  email.addEventListener("input", function(){ state.email = email.value; });
  var consent = document.getElementById("f_consent");
  consent.checked = state.consent;
  consent.addEventListener("change", function(){ state.consent = consent.checked; });
}

function renderAll(){
  renderStaticText();
  renderSections();
  syncRewardUI();
}

/* language switching preserves state entirely (state object independent of DOM) */
document.getElementById("btnAr").addEventListener("click", function(){ state.lang="ar"; renderAll(); });
document.getElementById("btnEn").addEventListener("click", function(){ state.lang="en"; renderAll(); });

/* progress bar */
window.addEventListener("scroll", function(){
  var h = document.documentElement;
  var scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
  document.getElementById("progress").style.width = Math.min(100, Math.max(0, scrolled*100)) + "%";
});

/* ================= validation & submit ================= */
function validate(){
  var errors = [];
  ["f_name","f_building","f_unit","f_household","f_nationality"].forEach(function(id){
    var input = document.getElementById(id);
    if(!input.value.trim()){ input.classList.add("invalid"); errors.push(id); }
  });
  var mobile = document.getElementById("f_mobile");
  if(!mobile.value.trim()){ mobile.classList.add("invalid"); errors.push("f_mobile"); }
  if(!state.consent) errors.push("consent");

  var rank = state.answers.q9 || {};
  var vals = Object.keys(rank).map(function(k){return rank[k];});
  var uniq = {};
  var rankComplete = QUESTIONS.filter(function(q){return q.id==="q9";})[0].items.every(function(it){ return rank[it.id]; });
  var dup = false;
  vals.forEach(function(v){ if(uniq[v]) dup = true; uniq[v]=true; });
  var rankError = rankComplete && !dup ? false : true;

  return {errors:errors, rankError: (Object.keys(rank).length>0) && rankError};
}

function collectPayload(ref){
  var langLabel = function(q, id){
    if(!id) return "";
    var found = (q.options||[]).filter(function(o){return o.id===id;})[0];
    return found ? found.en : id;
  };
  var out = {
    reference: ref,
    submittedAt: new Date().toISOString(),
    language: state.lang,
    tenant: state.tenant,
    reward: state.reward,
    mobile: state.mobile,
    email: state.email,
    answers: {}
  };
  QUESTIONS.forEach(function(q){
    var raw = state.answers[q.id];
    if(q.type === "multi"){
      var labels = (raw||[]).map(function(id){return langLabel(q,id);});
      if(state.answers[q.id+"_other_on"] && state.answers[q.id+"_other_text"]){
        labels.push("Other: " + state.answers[q.id+"_other_text"]);
      }
      out.answers[q.id] = labels;
    } else if(q.type === "single"){
      out.answers[q.id] = langLabel(q, raw);
    } else if(q.type === "rating"){
      out.answers[q.id] = raw || {};
    } else if(q.type === "rank"){
      out.answers[q.id] = raw || {};
    } else if(q.type === "matrix"){
      out.answers[q.id] = raw || {};
    } else if(q.type === "text"){
      out.answers[q.id] = raw || "";
    }
  });
  return out;
}

function buildEmailBody(payload){
  var lines = [];
  lines.push("Project Ripple — Tenant Survey Response");
  lines.push("Reference: " + payload.reference);
  lines.push("Submitted: " + payload.submittedAt);
  lines.push("");
  lines.push("Tenant: " + payload.tenant.name);
  lines.push("Building: " + payload.tenant.building + "   Unit: " + payload.tenant.unit);
  lines.push("Household size: " + payload.tenant.household + "   Nationality: " + payload.tenant.nationality);
  lines.push("Reward choice: " + payload.reward + "   Mobile: " + payload.mobile + "   Email: " + payload.email);
  lines.push("");
  QUESTIONS.forEach(function(q){
    var a = payload.answers[q.id];
    var val = typeof a === "object" ? JSON.stringify(a) : a;
    lines.push(q.num + ". " + q.text.en + " -> " + (val || "-"));
  });
  return lines.join("\n");
}

document.getElementById("submitBtn").addEventListener("click", function(){
  var res = validate();
  var summary = document.getElementById("errorSummary");
  if(res.errors.length || res.rankError){
    summary.classList.add("show");
    summary.textContent = res.rankError ? t("errRank") : t("errRequired");
    var firstBad = document.querySelector(".invalid");
    if(firstBad) firstBad.scrollIntoView({behavior:"smooth", block:"center"});
    else summary.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  summary.classList.remove("show");

  var ref = "RIPPLE-" + Date.now().toString(36).toUpperCase().slice(-6);
  var payload = collectPayload(ref);
  var btn = document.getElementById("submitBtn");
  btn.disabled = true;

  function finish(status){
    state.submitOutcome = status;
    document.getElementById("formView").style.display = "none";
    document.getElementById("confirmView").style.display = "block";
    document.getElementById("refCode").textContent = ref;
    updateConfirmText();
    var note = document.getElementById("statusNote");
    if(status === "ok"){
      note.className = "status-note ok"; note.textContent = t("statusOk");
    } else if(status === "duplicate"){
      note.className = "status-note ok"; note.textContent = state.lang==="ar" ? "تم استلام هذه الوحدة مسبقًا. سيتواصل معك فريقنا إذا لزم الأمر." : "This unit's response was already on file. Our team will reach out if needed.";
    } else if(status === "closed"){
      note.style.display = "none";
    } else {
      note.className = "status-note pending"; note.textContent = t("statusPending");
    }
    var mailBtn = document.getElementById("emailBtn");
    mailBtn.href = "mailto:" + COLLECTION_EMAIL + "?subject=" + encodeURIComponent("Project Ripple Survey - " + ref) + "&body=" + encodeURIComponent(buildEmailBody(payload));
    window.scrollTo({top:0, behavior:"smooth"});
  }

  if(SUBMIT_ENDPOINT){
    fetch(SUBMIT_ENDPOINT, {method:"POST", body: JSON.stringify(payload)})
      .then(function(r){ return r.json(); })
      .then(function(data){
        var s = data && data.status;
        finish(s === "duplicate" || s === "closed" ? s : "ok");
      })
      .catch(function(){ finish("pending"); });
  } else {
    finish("pending");
  }
});

document.getElementById("brandLogoImg").src = BRAND_LOGO_SRC;
renderAll();
checkCapacity();
bindTenantFields();
bindRewardCards();
})();
</script>
